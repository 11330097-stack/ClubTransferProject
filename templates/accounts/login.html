{% extends 'base.html' %}

{% block title %}登入 - 社團轉社系統{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">系統登入</h4>
            </div>
            <div class="card-body">
                <p class="text-muted">學生請使用學號登入；老師與管理員請使用管理員指派的帳號登入。</p>
                <form method="post" data-workflow-form>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label">帳號</label>
                        <input type="text" name="username" id="id_username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="id_password" class="form-label">密碼</label>
                        <input type="password" name="password" id="id_password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" data-submitting-label="登入中…">登入</button>
                </form>
            </div>
            <div class="card-footer text-muted text-center">
                <small>如需帳號協助，請聯繫訓育組</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
