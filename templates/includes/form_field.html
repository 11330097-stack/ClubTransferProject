{% load account_extras %}
<div class="form-field{% if field.errors %} has-error{% endif %}">
    <div class="form-field-label-row">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {% if field.field.required %}<span class="form-required">必填</span>{% else %}<span class="form-optional">選填</span>{% endif %}
    </div>
    {{ field|workflow_widget }}
    {% if field.help_text %}<div class="form-text" id="{{ field.id_for_label }}_help">{{ field.help_text|safe }}</div>{% endif %}
    {% if field.errors %}
        <div class="field-error" id="{{ field.id_for_label }}_errors" role="alert">
            {% for error in field.errors %}<span>{{ error }}</span>{% endfor %}
        </div>
    {% endif %}
</div>
