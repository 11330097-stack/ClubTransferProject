{% extends "base.html" %}

{% block title %}無法存取此頁｜社團轉社系統{% endblock %}

{% block content %}
<section class="state-page" aria-labelledby="error-title">
    <div class="state-panel state-panel--blocked">
        <svg class="state-panel__icon" aria-hidden="true"><use href="#icon-lock"></use></svg>
        <p class="state-panel__eyebrow">存取受限</p>
        <h1 id="error-title" class="state-panel__title">您沒有權限查看此頁面</h1>
        <p class="state-panel__description">這個功能不在您目前的使用權限內。您可以返回儀表板，繼續使用可存取的功能。</p>
        <div class="state-panel__actions"><a href="{% url 'home' %}" class="btn btn-primary">返回儀表板</a></div>
    </div>
</section>
{% endblock %}
