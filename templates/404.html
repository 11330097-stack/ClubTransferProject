{% extends "base.html" %}

{% block title %}找不到頁面｜社團轉社系統{% endblock %}

{% block content %}
<section class="state-page" aria-labelledby="error-title">
    <div class="state-panel state-panel--empty">
        <svg class="state-panel__icon" aria-hidden="true"><use href="#icon-search"></use></svg>
        <p class="state-panel__eyebrow">找不到內容</p>
        <h1 id="error-title" class="state-panel__title">找不到您要查看的頁面</h1>
        <p class="state-panel__description">頁面可能已移動、資料已不存在，或網址不正確。請返回儀表板重新選擇功能。</p>
        <div class="state-panel__actions"><a href="{% url 'home' %}" class="btn btn-primary">返回儀表板</a></div>
    </div>
</section>
{% endblock %}
