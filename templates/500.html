{% extends "base.html" %}

{% block title %}暫時無法完成｜社團轉社系統{% endblock %}

{% block content %}
<section class="state-page" aria-labelledby="error-title">
    <div class="state-panel state-panel--error">
        <svg class="state-panel__icon" aria-hidden="true"><use href="#icon-alert"></use></svg>
        <p class="state-panel__eyebrow">系統暫時無法完成要求</p>
        <h1 id="error-title" class="state-panel__title">這次操作沒有完成</h1>
        <p class="state-panel__description">請稍後再試一次；若問題持續發生，您也可以先返回儀表板使用其他功能。</p>
        <div class="state-panel__actions"><a href="{% url 'home' %}" class="btn btn-primary">返回儀表板</a></div>
    </div>
</section>
{% endblock %}
